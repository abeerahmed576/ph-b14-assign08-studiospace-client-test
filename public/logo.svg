<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" fill="none" width="200" height="44">
  <defs>
    <linearGradient id="ss-logo-gold" x1="4" y1="4" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9A44C" />
      <stop offset="50%" stop-color="#A27D26" />
      <stop offset="100%" stop-color="#735510" />
    </linearGradient>
    <radialGradient id="ss-logo-glow" cx="21" cy="22" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#C9A44C" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#8B6914" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Studio Spotlight & Aperture Icon (Left) -->
  <g transform="translate(1, 1)">
    <!-- Spotlight Rim -->
    <circle cx="21" cy="21" r="19" stroke="url(#ss-logo-gold)" stroke-width="2.2" />
    <!-- Outer Focus Ring -->
    <circle cx="21" cy="21" r="16" stroke="url(#ss-logo-gold)" stroke-width="0.8" stroke-dasharray="2 2.5" opacity="0.6" />
    
    <!-- 6 Aperture Blades -->
    <path d="M 21 8 L 29 16 L 25.5 21 Z" fill="url(#ss-logo-gold)" fill-opacity="0.85" />
    <path d="M 32 15 L 32 26 L 25.5 24 Z" fill="url(#ss-logo-gold)" fill-opacity="0.75" />
    <path d="M 32 27 L 24 34 L 21 29.5 Z" fill="url(#ss-logo-gold)" fill-opacity="0.85" />
    <path d="M 21 34 L 13 26 L 16.5 21 Z" fill="url(#ss-logo-gold)" fill-opacity="0.75" />
    <path d="M 10 27 L 10 16 L 16.5 18 Z" fill="url(#ss-logo-gold)" fill-opacity="0.85" />
    <path d="M 10 15 L 18 8 L 21 12.5 Z" fill="url(#ss-logo-gold)" fill-opacity="0.75" />

    <!-- Spotlight Center Beam -->
    <circle cx="21" cy="21" r="6" fill="url(#ss-logo-glow)" />
    <circle cx="21" cy="21" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- StudioSpace Wordmark -->
  <text x="48" y="28" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.03em" fill="currentColor">
    Studio<tspan fill="#C9A44C" font-weight="800">Space</tspan>
  </text>
  
  <!-- Subtle creative spotlight beam dot -->
  <circle cx="178" cy="18" r="2.5" fill="#C9A44C" />
</svg>

